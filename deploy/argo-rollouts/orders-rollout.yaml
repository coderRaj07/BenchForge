# The rollout shape. The promote, pause, and rollback decision is
# internal/canary.Decide. This file does not install a controller.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: orders
spec:
  replicas: 4
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {duration: 120}
        - setWeight: 25
        - pause: {duration: 120}
        - setWeight: 50
        - pause: {duration: 180}
        - setWeight: 100
      analysis:
        startingStep: 1
        templates:
          - templateName: benchforge-gate
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: orders:stable
          ports:
            - containerPort: 8080
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: benchforge-gate
spec:
  metrics:
    - name: benchforge-canary
      interval: 60s
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: gate
                    image: benchforge:local
                    args: ["canary"]
