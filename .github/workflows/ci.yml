name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o bin/benchforge ./cmd/cli

      - name: Validate manifests
        run: |
          ./bin/benchforge validate -f workloads/manifests/orders-api.yaml
          ./bin/benchforge validate -f workloads/manifests/orders-select.yaml
          ./bin/benchforge validate -f workloads/manifests/orders-select-regression.yaml
          ./bin/benchforge validate -f workloads/manifests/orders-pgbench.yaml
